spring:
  application:
    name: run-my-errands
  datasource:
    url: jdbc:postgresql://localhost:5432/run_my_errands
    username: rme
    password: rme_password
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    # CHANGE before any real use:  openssl rand -base64 48
    secret: "change-this-to-a-long-random-secret-before-production-CHANGE_ME"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
