# Same job as the Vite dev proxy: the browser only talks to this origin, so there's no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Notifications use SSE: don't buffer, and keep idle streams open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Client-side routes (/bookings/12 etc.) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
